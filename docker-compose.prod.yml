name: wortwerk

x-app: &app
  build: .
  image: wortwerk-app
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://wortwerk:${POSTGRES_PASSWORD}@postgres:5432/wortwerk
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wortwerk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wortwerk
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wortwerk -d wortwerk']
      interval: 5s
      retries: 20
    logging: *logging

  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'packages/db/src/migrate.ts']
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ['node', 'apps/worker/src/index.ts']
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-wortwerk.li}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    logging: *logging

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: wortwerk
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: wortwerk
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

volumes:
  postgres:
  storage:
  caddy_data:
  caddy_config:
