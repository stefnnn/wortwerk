services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wortwerk
      POSTGRES_PASSWORD: wortwerk
      POSTGRES_DB: wortwerk
    ports:
      - '5434:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wortwerk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
